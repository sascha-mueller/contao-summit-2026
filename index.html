<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die config.yaml – das unbekannte Wesen</title>
<meta name="description" content="Vortrag von Sascha Müller beim Contao Summit 2026: Folien, PDF und Konfigurationsdateien.">
<style>
  /* Schriften lokal in fonts/ (aus @fontsource, Subset latin) */
  @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; font-display: swap; src: url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Libre Franklin'; font-weight: 300; font-display: swap; src: url(fonts/libre-franklin-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Libre Franklin'; font-weight: 800; font-display: swap; src: url(fonts/libre-franklin-latin-800-normal.woff2) format('woff2'); }

  :root {
    --bg: #F5F7F7;
    --bg-tint: #E3EFF0;
    --ink: #1E2B2E;
    --body: #3F4E51;
    --muted: #5C6B6E;
    --petrol: #03849A;
    --petrol-text: #027386;
    --line: #C9D6D8;
    --on-petrol: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--body);
    font: 400 17px/1.6 'Inter', Arial, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 174px 16px 72px; }
  .event { margin: 0 0 12px; font-size: 14px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--petrol-text); }
  h1 {
    margin: 0 0 20px;
    font: 300 clamp(40px, 7vw, 72px)/1.05 'Libre Franklin', Arial, sans-serif;
    letter-spacing: -1.5px;
    color: var(--ink);
  }
  h1 strong { font-weight: 800; color: var(--petrol); }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 72px; }
  .more { margin: 32px 0 72px; }
  @media (min-width: 720px) {
    .more { margin-top: 48px; text-align: center; }
  }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    border: 2px solid var(--petrol);
    font-weight: 600; text-decoration: none;
    color: var(--petrol-text);
  }
  .btn.primary { background: var(--petrol); color: var(--on-petrol); }
  .btn:hover { background: var(--bg-tint); }
  .btn.primary:hover { filter: brightness(1.08); background: var(--petrol); }
  .btn:focus-visible, footer a:focus-visible { outline: 3px solid var(--petrol); outline-offset: 3px; }

  footer { padding-top: 24px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <p class="event">Contao Summit 2026</p>
  <h1>Die <strong>config.yaml</strong><br>das unbekannte Wesen</h1>

  <div class="actions">
    <a class="btn primary" href="slides/index.html">Folien starten →</a>

    <a class="btn" href="cto-root.zip" download>Dateien herunterladen (ZIP)</a>
  </div>
  <p class="more">
    <a class="btn" href="https://github.com/sascha-mueller/contao-summit-2026/tree/main/cto-root" target="_blank" rel="noopener">Dateien auf GitHub ansehen ↗</a>
  </p>

  <footer>Vortrag von Sascha Müller</footer>
</main>
</body>
</html>
