contao:
    localconfig:
        dateFormat: d.m.Y
        datimFormat: d.m.Y H:i
        timeFormat: H:i
        timeZone: Europe/Berlin

        allowedDownload: jpg,jpeg,gif,png,svg,svgz,webp,avif,heic,jxl,odt,ods,odp,odg,ott,ots,otp,otg,pdf,doc,docx,dot,dotx,xls,xlsx,xlt,xltx,ppt,pptx,pot,potx,mp3,mp4,m4a,m4v,webm,ogg,ogv,wma,wmv,ram,rm,mov,zip,rar,7z,md
        gdMaxImgHeight: 9000
        gdMaxImgWidth: 9000
        maxFileSize: 209713400 # 200MB
        imageWidth: 5000
        imageHeight: 5000
        uploadTypes: jpg,jpeg,png,svg,pdf,txt,zip,rar,7z,json,mp4,xls,xlsx,doc,docx

        resultsPerPage: 50
        maxResultsPerPage: 500

        # security
        allowedTags: <a><abbr><acronym><address><area><article><aside><audio><b><bdi><bdo><big><blockquote><br><button><caption><cite><code><col><colgroup><data><datalist><dd><del><details><dfn><div><dl><dt><em><fieldset><figcaption><figure><footer><form><h1><h2><h3><h4><h5><h6><header><hgroup><hr><i><img><input><ins><kbd><label><legend><li><map><mark><menu><nav><ol><optgroup><option><output><p><picture><pre><q><s><samp><section><select><small><source><span><strong><style><sub><summary><sup><table><tbody><td><textarea><tfoot><th><thead><time><tr><tt><u><ul><var><video><wbr>

        adminEmail: '%env(ADMIN_EMAIL)%'
        undoPeriod: 5184000
        versionPeriod: 7776000
        logPeriod: 604800
        defaultUser: 1
        defaultGroup: 1
        minPasswordLength: 8



        # Utils Bundle
        # utilsGoogleApiKey:
        # activateDbCache: